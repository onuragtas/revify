# Build, package and release the Revify desktop app.
#
# This runs on a public repository, which shapes two things:
#
#   1. It needs no secrets beyond the token GitHub already provides. Pull
#      requests from forks run the checks in full, because nothing here can
#      reach a real Jira, GitLab or model.
#   2. Every push to master releases. The version is worked out here rather
#      than tagged by hand — a release that needs someone to remember a
#      command is a release that stops happening.
#
# The API's source lives in this repository too, but Jenkins builds and
# deploys it (see the Jenkinsfile): one binary on one server is a different
# shipping problem from installers people download.

name: App

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` rather than `install`: it installs exactly the lockfile and
      # fails if package.json and the lock disagree, so CI cannot silently
      # test a different dependency tree than a developer has.
      - run: npm ci

      - name: Guard against committed credentials
        run: |
          set -eu
          if git grep -nIE "glpat-[A-Za-z0-9_-]{20}|ATATT[A-Za-z0-9_-]{20}|sk-ant-[A-Za-z0-9_-]{20}|xoxb-[0-9]{10,}" -- .; then
            echo "::error::A credential appears to be committed. Rotate it, then remove it from history."
            exit 1
          fi
          for tracked in .env config/config.yaml; do
            if git ls-files --error-unmatch "$tracked" >/dev/null 2>&1; then
              echo "::error::$tracked is tracked but must never be."
              exit 1
            fi
          done

      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

      # A compile that produces something unrunnable still passes tsc. The
      # UI is a single file the build copies; if that copy breaks, every run
      # mode serves a blank page.
      - name: Files the build must produce
        run: |
          test -f dist/web/public/index.html
          test -f dist/adapters/tasks/prompts/codeReview.md
          test -f dist/desktop/main.js

      - name: Smoke — the server starts and serves the UI
        run: |
          set -eu
          cp config/config.example.yaml config/config.yaml
          cat > .env <<'ENVEOF'
          JIRA_BASE_URL=https://example.invalid
          JIRA_EMAIL=ci@example.invalid
          JIRA_API_TOKEN=ci-not-a-real-token
          GITLAB_BASE_URL=https://example.invalid
          GITLAB_TOKEN=ci-not-a-real-token
          ENVEOF

          UI_PORT=4399 node dist/web/index.js > smoke.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "http://127.0.0.1:4399/" && break
            [ "$i" = "30" ] && { cat smoke.log; exit 1; }
            sleep 1
          done

          # The example config must ship with Jira writes off. If this flips,
          # a fresh clone is one command away from commenting on real issues.
          curl -fsS http://127.0.0.1:4399/api/outcome-config | grep -q '"applyChanges":false'

      - name: The dev build must not point at production
        run: |
          set -eu
          node -e "import('./dist/core/backendUrl.js').then(m=>{
            if (m.isProductionBackend()) { console.error('a default build points at production'); process.exit(1); }
            console.log('dev backend:', m.backendUrl());
          })"
          REVIFY_ENV=production node -e "import('./dist/core/backendUrl.js').then(m=>{
            if (!m.isProductionBackend()) { console.error('REVIFY_ENV=production did not take'); process.exit(1); }
            console.log('prod backend:', m.backendUrl());
          })"

  version:
    name: Work out the version
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      # Tags are the record of what has been released, so the whole history
      # is needed — a shallow clone has none of them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: pick
        name: Next version
        run: |
          set -eu

          # A tag push releases exactly what was tagged. Anything else is a
          # push to master, which becomes the next patch after the highest
          # release so far — falling back to package.json when there are no
          # releases yet.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            latest="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
            if [ -z "$latest" ]; then
              version="$(node -p "require('./package.json').version")"
            else
              version="$(echo "${latest#v}" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')"
            fi
            tag="v${version}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

  package:
    name: Package (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others worked.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # electron-builder takes the installer's filename and the app's
      # reported version straight from package.json. Without this, every
      # release would ship a file called Revify-0.1.0.dmg whatever it
      # actually was.
      - name: Stamp the version
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version

      # REVIFY_ENV decides which backend the build talks to, and it is baked
      # in at build time on purpose — see src/core/backendUrl.ts. A released
      # app must point at the deployed service.
      - name: Build for production
        run: npm run build
        env:
          REVIFY_ENV: production

      - name: Package
        run: npx --yes electron-builder --publish never
        env:
          REVIFY_ENV: production
          # Unsigned builds. Signing needs certificates, which are secrets,
          # which fork pull requests must never see — so it is a separate,
          # deliberate step rather than something this workflow assumes.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: revify-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.AppImage
          # Producing nothing is a failure, not a warning: the release below
          # would otherwise publish an empty download.
          if-no-files-found: error

  release:
    name: Release ${{ needs.version.outputs.tag }}
    if: github.event_name != 'pull_request'
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      # Only this job writes, and only to create the tag and the release.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          # Creates the tag on this commit if it does not exist yet — this
          # is what lets a plain push to master release without anyone
          # remembering to tag.
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*
          generate_release_notes: true
          # Publishing a release with no installers attached is worse than
          # failing: it looks like something you can download.
          fail_on_unmatched_files: true
