# Revify API — production compose.
#
# One service. It is a single static binary with a SQLite file beside it;
# there is no database container to run and nothing to orchestrate.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: revify-api:${BUILD_NUMBER:-local}
    container_name: revify-api
    restart: unless-stopped

    # Runs as the owner of the mounted data directory. The image pins
    # 10001, and the deploy script chowns to match — a container writing to
    # a bind mount it does not own fails at the first write, which is the
    # database, which is the whole service.
    user: "${APP_UID:-10001}:${APP_GID:-10001}"

    # Bound to every interface. That means this HTTP port is reachable
    # directly, not only through whatever terminates TLS in front of it —
    # so the host firewall is now the thing deciding who can reach it, and
    # a session that arrives over plain HTTP gets a cookie without the
    # Secure flag (see handler.setSessionCookie).
    #
    # API_BIND exists so this can be tightened to 127.0.0.1 later without
    # editing the file.
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-4322}:4322"

    # A bind mount rather than a named volume: the deploy script backs this
    # file up before every restart, and a path you can point `cp` at is
    # worth more than a volume you have to go looking for.
    volumes:
      - ./data:/data

    environment:
      API_ADDR: ":4322"
      API_DB: "/data/api.db"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4322/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
