<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Revify</title>
<link rel="stylesheet" href="./app.css" />
</head>

<body>
  <!--
    The application is Vue — see src/web/ui. This file is a mount point and
    two tags that load it.

    Both are external files rather than inline blocks, which is what lets the
    server send `style-src 'self'` and `script-src 'self'` with no
    `'unsafe-inline'` anywhere. `app.css` stays one file rather than being
    split per component: it is a single set of design tokens (light and dark)
    that every component reads, and dividing it would mean re-deciding the
    whole visual language rather than moving it.
  -->
  <div id="app"></div>
  <script type="module" src="./assets/ui.js"></script>
</body>
</html>
